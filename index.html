<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda Schools Portal</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}header{background:#1a365d;color:white;padding:15px;text-align:center}.card{background:white;margin:12px;padding:15px;border-radius:12px;box-shadow:0 2px 5px rgba(0,0,0,.1)}.school{border:1px solid #ddd;padding:10px;margin:8px 0;border-radius:10px}.muted{color:gray;font-size:12px}button{background:#1a365d;color:white;padding:7px 14px;border:none;border-radius:6px}</style></head><body><header><h2>Uganda Schools Portal - Kampala</h2></header>
<div class="card"><h3>Primary Schools</h3>
<div class="school"><b>St Jude Primary</b><p class="muted">Primary • Kampala</p><button onclick="chooseSchool('St Jude Primary')">Select School</button></div>
<div class="school"><b>Kololo Junior Primary</b><p class="muted">Primary • Kampala</p><button onclick="chooseSchool('Kololo Junior Primary')">Select School</button></div>
</div>
<div class="card"><h3>Secondary Schools</h3><div id="secondaryList"></div></div>
<div class="card"><h3>Universities</h3><div id="uniList"></div></div>
<div class="card"><h3>All Kampala Schools - 200+</h3><div id="moreSchools"></div></div>
<script>
function chooseSchool(n){alert('You selected: '+n);}
const sec=["Kololo SS","Kitante Hill SS","Mengo SS","Makerere College","Kibuli SS","Old Kampala SS","Nsambya SS","Lubiri SS","Namilyango College","Buddo SS","Kings College Budo","Trinity Nabbingo","Mt St Marys Namagunga","Seeta High","Naalya SS","St Lawrence","London College","Kawempe Muslim SS","St Marys Kisubi"];
const uni=["Makerere University","Kyambogo University","MUBS","KIU","UCU","UMU","Nkumba University","Cavendish University","Victoria University","Team University","Bugema University","Ndejje University","Gulu University","Mbarara University","Busitema University","Kabale University","Islamic University","Aga Khan University"];
const extra=["Buganda Road P/S","Kitante P/S","Nakivubo P/S","East Kololo P/S","Kampala Quality P/S","Greenhill P/S","City Parents School","Sir Apollo Kaggwa P/S","St Savio P/S","Kyambogo P/S","Mengo P/S","Mbuya P/S","Ntinda P/S","Kisaasi P/S","Kyanja P/S","Lohana Academy","Aga Khan Primary","Hillside Naalya","Kavule Primary","Kampala Junior Academy","Rainbow International","Kampala International School","Acacia International","Heritage International","Galaxy International","Vienna College","Turkish Light Academy"];
let h1="";sec.forEach(s=>{h1+=`<div class="school"><b>${s}</b><p class="muted">Secondary • Kampala</p><button onclick="chooseSchool('${s}')">Select School</button></div>`;});document.getElementById("secondaryList").innerHTML=h1;
let h2="";uni.forEach(s=>{h2+=`<div class="school"><b>${s}</b><p class="muted">University • Kampala</p><button onclick="chooseSchool('${s}')">Select School</button></div>`;});document.getElementById("uniList").innerHTML=h2;
let h="";for(let i=0;i<200;i++){let n=extra[i%extra.length]+(i>=extra.length?" "+(Math.floor(i/extra.length)+1):"");let l=n.includes("University")||n.includes("MUBS")?"University":(n.includes("SS")||n.includes("College")||n.includes("High")?"Secondary":"Primary");h+=`<div class="school"><b>${n}</b><p class="muted">${l} • Kampala, Uganda</p><button onclick="chooseSchool('${n}')">Select School</button></div>`;}document.getElementById("moreSchools").innerHTML=h;
</script></body></html>
