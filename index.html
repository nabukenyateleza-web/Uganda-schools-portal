<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uganda Schools Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#111;color:#fff}
.logoBar{background:#000;text-align:center;padding:20px;border-bottom:3px solid gold}
.logoBar img{width:120px;height:120px;border-radius:50%;border:4px solid gold;background:#fff;object-fit:cover;display:block;margin:0 auto 10px}
.logoBar h1{color:gold;font-size:24px}
.counter{background:#1a1a1a;color:gold;text-align:center;padding:8px;font-weight:900}
.hero{padding:40px 15px;text-align:center;background:#222}
.hero h2{color:gold;margin-bottom:10px}
.btn{background:gold;color:#000;padding:12px 25px;border-radius:25px;text-decoration:none;font-weight:900;display:inline-block;margin-top:15px}
.section{padding:20px;max-width:1000px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.card{background:#1e1e1e;border-left:4px solid gold;padding:15px;border-radius:8px}
.footer{background:#000;color:gold;text-align:center;padding:15px;border-top:2px solid gold}
@media(max-width:600px){.logoBar h1{font-size:18px}.hero h2{font-size:20px}}
</style>
</head>
<body>
<div class="logoBar"><img src="logo.png"><h1>UGANDA SCHOOLS PORTAL</h1><p>By Mulindwa Jovan</p></div>
<div class="counter">👁️ Visitors: <span id="vc">0</span></div>
<div class="hero"><h2>Welcome</h2><p>Find schools across Uganda</p><a class="btn" href="#contact">Apply Now</a></div>
<div class="section">
<div class="card"><h3>🎓 About</h3><p>Connecting parents & schools.</p></div>
<div class="card"><h3>📚 Programmes</h3><p>Day Care, Nursery, Primary, High School</p></div>
<div class="card" id="contact"><h3>📞 Contact</h3><p>Kampala, Uganda<br>+256 700 000 000</p></div>
</div>
<div class="footer">© 2026 Uganda Schools Portal</div>
<script>let c=localStorage.getItem('ug');c=c?+c+1:1;localStorage.setItem('ug',c);document.getElementById('vc').innerText=c;</script>
</body>
</html>
