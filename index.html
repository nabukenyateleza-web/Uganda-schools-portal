<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uganda Schools Portal</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f0f;color:#fff;text-align:center}
.top{background:linear-gradient(135deg,#ff6a00,#ff9500);padding:20px}
.logo{width:90px;height:90px;border-radius:50%;background:#fff;padding:3px;margin:0 auto;display:block}
.search{padding:10px;background:#1a1a1a;position:sticky;top:0}
.search input{width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#222;color:#fff}
.filters{display:flex;gap:6px;overflow:auto;padding:8px;background:#1a1a1a}
.filters button{padding:6px 12px;border-radius:20px;border:1px solid #444;background:#222;color:#ccc}
.filters button.active{background:#ff6a00;color:#fff}
.school{background:#1e1e1e;margin:8px;padding:12px;border-radius:10px;border-left:4px solid #ff6a00;text-align:left}
.school b{color:#ffcc00}
.school small{color:#aaa;display:block}
</style>
</head>
<body>

<div class="top">
<img src="logo.png" class="logo">
<h1>Uganda Schools Portal</h1>
<p>Real Schools - P1-P7 - S1-S6 - University</p>
<small id="total"></small>
</div>

<div class="search">
<input id="q" placeholder="Search Makerere, Gayaza...">
</div>

<div class="filters">
<button class="active" onclick="filter('all',this)">All</button>
<button onclick="filter('University',this)">Universities</button>
<button onclick="filter('Secondary',this)">S1-S6</button>
<button onclick="filter('Primary',this)">P1-P7</button>
</div>

<div id="list"></div>

<script>
const schools = [
 ["Makerere University","Kampala","University"],
 ["Kyambogo University","Kampala","University"],
 ["MUST Mbarara","Mbarara","University"],
 ["Gulu University","Gulu","University"],
 ["Busitema University","Tororo","University"],
 ["UCU Mukono","Mukono","University"],
 ["KIU","Kampala","University"],
 ["Gayaza High School","Wakiso","Secondary S1-S6"],
 ["King's College Budo","Wakiso","Secondary S1-S6"],
 ["Namagunga","Mukono","Secondary S1-S6"],
 ["Namilyango College","Mukono","Secondary S1-S6"],
 ["Kibuli SS","Kampala","Secondary S1-S6"],
 ["Ntare School","Mbarara","Secondary S1-S6"],
 ["Jinja College","Jinja","Secondary S1-S6"],
 ["Gulu High","Gulu","Secondary S1-S6"],
 ["Kampala Parents","Kampala","Primary P1-P7"],
 ["Buganda Road Primary","Kampala","Primary P1-P7"],
 ["City Parents School","Kampala","Primary P1-P7"]
];

let cur='all';
function render(){
 let q=document.getElementById('q').value.toLowerCase();
 let f=schools.filter(s=>(cur=='all'||s[2].includes(cur))&&s.join(' ').toLowerCase().includes(q));
 document.getElementById('list').innerHTML=f.map(s=>`<div class="school"><b>${s[0]}</b><small>${s[2]} - ${s[1]}</small></div>`).join('');
 document.getElementById('total').innerText=f.length+' schools';
}
function filter(t,b){
 cur=t;
 document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');
 render();
}
document.getElementById('q').addEventListener('input',render);
render();
</script>

</body>
</html>
