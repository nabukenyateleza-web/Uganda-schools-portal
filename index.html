<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width"><title>Uganda Portal</title><style>body{font-family:Arial;margin:0;padding:10px;background:#f0f8ff}.top{background:#000;color:gold;padding:15px;text-align:center;font-weight:bold;border-radius:10px}.f{display:flex;gap:5px;padding:8px;overflow:auto}.f button{background:#222;color:#fff;border:1px solid gold;padding:8px 15px;border-radius:20px}.f button.active{background:gold;color:#000}#g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.card{background:#fff;padding:15px;border-radius:10px}#s{width:100%;padding:12px;border-radius:10px;border:2px solid #000;margin-top:10px}</style></head><body>
<div class="top">Uganda National Portal - 60 Schools<br><small>S2 ACTIVE - 2026 OPEN</small></div>
<div class="f"><button class="active" onclick="fil('all',this)">All</button><button onclick="fil('primary',this)">Primary</button><button onclick="fil('secondary',this)">Secondary</button><button onclick="fil('university',this)">University</button></div>
<input id="s" oninput="search()" placeholder="Search schools...">
<div id="g"></div>
<div id="p" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:99"><div style="background:#fff;margin:20% auto;padding:20px;border-radius:15px;width:90%;max-width:400px"><h2 id="pn"></h2><p id="p1"></p><p>Code: <b id="pc"></b></p><button onclick="applyWA()" style="background:#25D366;color:#fff;width:100%;padding:14px;border-radius:10px;font-weight:bold;border:none">Apply via WhatsApp</button><br><button onclick="p.style.display='none'" style="width:100%;margin-top:8px;padding:8px">Close</button></div></div>
<script>
let MY_WA="256761429404";let curSchool="";let schools=[{n:"Buganda Road Primary",l:"primary",c:"PR001"},{n:"Kitante Primary",l:"primary",c:"PR002"},{n:"Nakasero Primary",l:"primary",c:"PR003"},{n:"Greenhill Primary",l:"primary",c:"PR004"},{n:"Kampala Parents",l:"primary",c:"PR005"},{n:"Uganda Martyrs Lubaga",l:"secondary",c:"ST001"},{n:"St Jude Kakooge",l:"secondary",c:"ST002"}];
let cur="all";let gg=document.getElementById('g');function render(){gg.innerHTML="";schools.filter(s=>cur=='all'||s.l==cur).forEach(s=>{gg.innerHTML+=`<div class="card" onclick="openP('${s.n}','${s.c}','${s.l}')"><b>${s.n}</b><br><small>${s.l.toUpperCase()} - ${s.c}</small></div>`})}render();
function fil(l,b){cur=l;document.querySelectorAll('.f button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}
function search(){let q=document.getElementById('s').value.toLowerCase();document.querySelectorAll('.card').forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none'})}
function openP(n,c,l){curSchool=n;pn.innerText=n;pc.innerText=c;p1.innerText=l.toUpperCase()+" - S2 ACTIVE - OPEN 2026";p.style.display='block';}function applyWA(){let m=encodeURIComponent("Hello! I want to APPLY for "+curSchool+" ("+pc.innerText+") - Uganda Portal S2 ACTIVE - Send admission 2026.");window.open("https://wa.me/"+MY_WA+"?text="+m,"_blank");}
</script></body></html>
