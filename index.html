<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda Schools Portal - All Uganda</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0f0f0f;color:#fff}
.top{background:#ff7a00;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:14px}
.st{background:#1e1e1e;border:1px solid #2a2a2a;border-radius:12px;padding:12px;text-align:center}
.st b{color:#ff7a00;font-size:26px;display:block}
.st span{font-size:11px;color:#aaa}
.search{padding:0 14px 10px;display:flex;gap:8px}
.search input{flex:1;background:#1e1e1e;border:1px solid #333;border-radius:22px;padding:10px 14px;color:#fff}
.card{background:#1c1c1c;margin:0 14px 10px;border-radius:14px;padding:12px;border:1px solid #2a2a2a}
.num{padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;background:#ff7a00}
.meta{font-size:11px;color:#aaa;margin:4px 0}
.btn{background:#ffcc00;color:#000;border:0;padding:7px 16px;border-radius:18px;font-weight:700;float:right}
</style></head><body>
<div class="top"><b>🛡️ Uganda-schools-portal</b><span>🔍 🔔 👤</span></div>
<div style="padding:14px"><h2>National Student Management Portal</h2><p style="color:#aaa;font-size:13px">All schools in Uganda • Manage • Monitor • Connect</p></div>
<div class="stats"><div class="st"><b>1041</b><span>Total Schools</span></div><div class="st"><b>629</b><span>Government</span></div><div class="st"><b>412</b><span>Private</span></div></div>
<div class="search"><input id="sBox" placeholder="🔍 Search school name, district..." oninput="search()"></div>
<div id="list"></div>
<script>
let data=[
"Uganda Martyrs High School Lubaga","St Jude Kakooge Primary","Mbarara High School","Kololo Senior Secondary","Makerere College School","Greenhill Academy Kibuli","Seeta High School Mukono","King's College Budo","Gayaza High School","Namilyango College","Mt St Mary's Namagunga","Trinity College Nabbingo","St Mary's Kitende","Kampala Parents School","Kabojja International","Aga Khan High School","Vienna College Namugongo","Seeta Green Campus","Buddo SS","Mengo SS","Kibuli SS","Ntare School Mbarara","Mbarara High","Maryhill High Mbarara","Bweranyangi Girls","Busoga College Mwiri","Jinja College","Kiira College Butiki","Teso College Aloet","St Peters Tororo","Manjasi High Tororo","Mbale SS","Nabumali High","Moroto High","Lira Town College","Dr Obote College Borobana","Gulu High","St Joseph Layibi","Lango College","Kigezi High","Kigezi College Butobere","Kabale Brain Storm","Ntungamo High","Rwampara High"
];
function render(a){let h="";a.forEach((n,i)=>{h+=`<div class="card"><div class="meta"><span class="num">#${i+1}</span> ${i%2==0?'Government':'Private'} • Central Region</div><b>${n}</b><div class="meta">📍 Uganda • Est. ${1960+i}</div><div style="clear:both;padding-top:8px"><span class="meta">👥 Students: ${400+i*12}</span><button class="btn" onclick="alert('${n} selected')">Contact</button></div></div>`});document.getElementById("list").innerHTML=h}
render(data);
function search(){let q=document.getElementById("sBox").value.toLowerCase();render(data.filter(x=>x.toLowerCase().includes(q)))}
</script>
</body></html>
