<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uganda School Management - Multi-Tenant Portal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
body{font-family:'Inter',sans-serif;background:#f6f7fb}
.nav-active{background:#111827;color:white}
</style>
</head>
<body class="text-sm">
<div class="min-h-screen flex">
<div class="w-[270px] bg-black text-white flex flex-col fixed h-screen overflow-y-auto z-50">
<div class="p-5 border-b border-white/10">
<div class="flex items-center gap-3">
<div class="w-9 h-9 bg-yellow-400 rounded-lg flex items-center justify-center text-black font-bold">UG</div>
<div><p class="font-bold leading-tight" id="schoolNameDisplay">St. Mary's College Kisubi</p><p class="text-[11px] text-white/60">Multi-School • Uganda</p></div>
</div>
</div>
<div class="p-3">
<p class="text-[10px] tracking-widest text-white/40 font-bold px-2 mb-2">MAIN PORTAL</p>
<nav id="mainNav" class="space-y-1"></nav>
<p class="text-[10px] tracking-widest text-white/40 font-bold px-2 mt-6 mb-2">PARENT VIEW</p>
<button onclick="switchRole('parent')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 text-left"><i class="ri-parent-line"></i> My Children <span class="ml-auto bg-yellow-400 text-black text-[10px] px-2 py-0.5 rounded-full">SECURE</span></button>
</div>
<div class="mt-auto p-3 border-t border-white/10">
<div class="bg-white/5 rounded-xl p-3"><p class="text-[11px] text-white/60">Logged as</p><p class="font-semibold" id="currentRoleDisplay">Head Teacher</p>
<div class="flex gap-1 mt-2 flex-wrap">
<button onclick="switchRole('head')" class="text-[10px] px-2 py-1 bg-white text-black rounded">HEAD</button>
<button onclick="switchRole('deputy')" class="text-[10px] px-2 py-1 bg-white/10 rounded">DEPUTY</button>
<button onclick="switchRole('dos')" class="text-[10px] px-2 py-1 bg-white/10 rounded">DOS</button>
<button onclick="switchRole('teacher')" class="text-[10px] px-2 py-1 bg-white/10 rounded">TEACHER</button>
</div></div>
</div>
</div>

<div class="flex-1 ml-[270px]">
<div class="h-[60px] bg-white border-b flex items-center justify-between px-6 sticky top-0 z-40">
<div class="flex items-center gap-4"><h1 id="pageTitle" class="text-xl font-bold">Dashboard</h1><span class="text-[11px] bg-green-100 text-green-700 px-2 py-1 rounded-full">Data isolated • This school only</span></div>
<div class="flex items-center gap-3">
<button onclick="showModule('notifications')" class="relative w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center"><i class="ri-notification-3-line"></i><span class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center">5</span></button>
<button onclick="showModule('audit')" class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center"><i class="ri-history-line"></i></button>
<select id="schoolSwitcher" onchange="changeSchool(this.value)" class="border rounded-lg px-3 py-2 text-xs font-medium"><option>St. Mary's College Kisubi</option><option>Gayaza High School</option><option>King's College Budo</option><option>New School + Configure</option></select>
</div>
</div>

<div class="p-6">
<div id="mod-dashboard" class="module">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
<div class="bg-white p-5 rounded-2xl border"><p class="text-gray-500 text-xs">Total Students</p><p class="text-3xl font-bold mt-1">1,248</p><p class="text-[11px] text-green-600 mt-1">↑ 12 this term</p></div>
<div class="bg-white p-5 rounded-2xl border"><p class="text-gray-500 text-xs">Fees Collected</p><p class="text-3xl font-bold mt-1">UGX 84M</p><p class="text-[11px] text-green-600 mt-1">72% paid</p></div>
<div class="bg-white p-5 rounded-2xl border"><p class="text-gray-500 text-xs">Attendance Today</p><p class="text-3xl font-bold mt-1">94.2%</p><p class="text-[11px] text-red-600 mt-1">16 absent</p></div>
<div class="bg-white p-5 rounded-2xl border"><p class="text-gray-500 text-xs">Avg Performance</p><p class="text-3xl font-bold mt-1">68.4%</p><p class="text-[11px] text-green-600 mt-1">↑ IMPROVED</p></div>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-4"><div class="md
