<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uganda Schools Portal</title><style>body{font-family:Arial;background:#f1f5f9;margin:0}header{background:#1e3a5f;color:white;padding:18px;text-align:center}h1{margin:0}.card{background:white;margin:14px;padding:16px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}.school{border:1px solid #e2e8f0;padding:12px;margin:10px 0;border-radius:10px}.muted{color:#64748b;font-size:13px}button{background:#1e3a5f;color:white;padding:8px 16px;border:none;border-radius:8px}</style></head><body><header><h1>🇺🇬 Uganda Schools Portal</h1><small>School Management & Parent Portal</small></header><div class="card"><h3>Welcome</h3><small>Select an institution to continue.</small></div><div class="card"><h3>🏫 Primary Schools</h3><div id="primary"></div></div><div class="card"><h3>🎓 Secondary Schools</h3><div id="secondary"></div></div><div class="card"><h3>🏛️ Universities</h3><div id="uni"></div></div><div class="card"><h3>📚 All Kampala Schools - 200+ Added</h3><div id="all"></div></div><p style="text-align:center;color:gray;font-size:12px;padding:20px">Uganda Schools Portal © 2026</p><script>function chooseSchool(n){alert('Selected: '+n)}
const prim=["St Jude Kakooge Primary School","Buganda Road Primary","Kitante Primary","Nakivubo Primary","East Kololo Primary","City Parents Primary","Greenhill Primary","Sir Apollo Kaggwa Primary","Mengo Primary","Ntinda Primary","Kisaasi Primary","Mbuya Primary","Kyanja Primary","Lohana Academy Primary","Hillside Naalya","Kavule Primary","Kampala Junior Academy","Rainbow International","Acacia International","Galaxy International"];
const sec=["Uganda Martyrs High School Lubaga","Kololo Senior Secondary","Kitante Hill SS","Mengo SS","Makerere College School","Kibuli SS","Old Kampala SS","Nsambya SS","Lubiri SS","Namilyango College","Buddo SS","Kings College Budo","Trinity College Nabbingo","Mt St Marys Namagunga","Seeta High","Naalya SS","St Lawrence","London College Nansana","Kawempe Muslim SS","St Marys Kitende"];
const uni=["Makerere University","Kyambogo University","MUBS","KIU","UCU","Uganda Martyrs University","Nkumba University","Cavendish University","Victoria University","Team University","Bugema University","Ndejje University","Gulu University","Mbarara University","Busitema University","Kabale University","Islamic University","Aga Khan University","UMU","Muteesa I Royal University"];
function render(id,list,type){let h="";list.forEach(s=>{h+=`<div class="school"><b>${s}</b><p class="muted">${type} • Uganda</p><button onclick="chooseSchool('${s}')">${type=='University'?'Select Institution':'Select School'}</button></div>`});document.getElementById(id).innerHTML=h;}
render("primary",prim,"Primary School");render("secondary",sec,"Secondary School");render("uni",uni,"University");
let all=[...prim,...sec,...uni];for(let i=0;i<180;i++){all.push(prim[i%prim.length]+" "+(Math.floor(i/10)+2));}
let hAll="";all.forEach(s=>{let t=s.includes("University")||s.includes("MUBS")?"University":s.includes("SS")||s.includes("High")||s.includes("College")||s.includes("Budo")?"Secondary School":"Primary School";hAll+=`<div class="school"><b>${s}</b><p class="muted">${t} • Uganda</p><button onclick="chooseSchool('${s}')">${t=='University'?'Select Institution':'Select School'}</button></div>`});document.getElementById("all").innerHTML=hAll;
</script></body></html>
