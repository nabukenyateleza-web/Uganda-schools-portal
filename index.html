<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uganda School Portal v2.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#121212;color:#fff;padding-bottom:70px}
.tm{background:#000;text-align:center;padding:24px 12px;border-bottom:3px solid #d4af37}
.tm h1{color:#d4af37;font-size:26px;letter-spacing:2px;margin-top:8px}
.tm h2{color:#d4af37;font-size:13px;font-weight:400}
.head{background:#ff7a00;margin:12px;border-radius:18px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.stats{display:flex;gap:8px;margin:0 12px}
.st{background:#1e1e1e;border:1px solid #333;border-radius:14px;padding:12px;flex:1;text-align:center}
.st b{color:#ff7a00;font-size:24px;display:block}
.search{margin:12px;background:#1e1e1e;border-radius:24px;padding:10px 12px;display:flex;gap:6px}
.search input{flex:1;background:transparent;border:0;color:#fff;outline:none}
.card{background:#1e1e1e;border-radius:16px;padding:12px;margin:10px 12px;border:1px solid #2a2a2a}
.tag{background:#ff7a00;color:#fff;padding:2px 6px;border-radius:5px;font-size:10px;font-weight:800}
.contact{background:#ffcc00;color:#000;border:0;padding:7px 16px;border-radius:12px;font-weight:800;float:right}
</style></head><body>

<div class="tm">
<div style="font-size:44px">👑</div>
<div style="width:110px;height:110px;border:2px solid #d4af37;border-radius:50%;margin:8px auto;display:flex;align-items:center;justify-content:center;font-size:42px">📖</div>
<h1>UGANDA SCHOOL</h1>
<h2>School Portal • v2.1</h2>
<div style="color:#fff;margin-top:8px;font-size:13px">🇺🇬 Kampala, Uganda</div>
</div>

<div class="head"><b>🛡️ Uganda-schools-portal</b><span>🔍 🔔 👤</span></div>
<div style="padding:0 14px"><h3>National Student Management Portal</h3><p style="font-size:12px;color:#aaa">All schools in Uganda • Manage • Monitor • Connect</p></div>
<div class="stats"><div class="st"><b>1041</b><span style="font-size:11px">Total Schools</span></div><div class="st"><b>629</b><span style="font-size:11px">Government</span></div><div class="st"><b>412</b><span style="font-size:11px">Private</span></div></div>
<div class="search">🔍 <input id="q" placeholder="Search school name, district, type..." oninput="search()"></div>
<div id="list"></div>

<script>
let d=[{n:"Uganda Martyrs High School Lubaga",l:"Lubaga, Kampala • Est. 1968",t:"Government • Central • Lubaga",s:"1,248"},{n:"St Jude Kakooge Primary School",l:"Kakooge, Nakasongola • Est. 2005",t:"Private • Central • Kakooge",s:"412"},{n:"Mbarara High School",l:"Mbarara City • Est. 1960",t:"Government • Western",s:"980"},{n:"Kololo Senior Secondary",l:"Kololo, Kampala",t:"Government • Central",s:"1200"},{n:"Greenhill Academy Kibuli",l:"Kibuli, Kampala",t:"Private",s:"2100"}];
function show(a){let h="";a.forEach((x,i)=>{h+=`<div class="card"><div style="font-size:11px;color:#aaa"><span class="tag">#${i+1}</span> ${x.t}</div><div style="font-weight:700;margin:6px 0">${x.n}</div><div style="font-size:12px;color:#aaa">📍 ${x.l}</div><div style="font-size:11px;color:#aaa">👥 ${x.s}</div><button class="contact">Contact</button><div style="clear:both"></div></div>`});document.getElementById("list").innerHTML=h}
show(d);function search(){let v=document.getElementById("q").value.toLowerCase();show(d.filter(x=>x.n.toLowerCase().includes(v)))}
</script>
</body></html>
