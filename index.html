<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uganda Portal</title>
<style>
body{background:#0f0f0f;color:white;font-family:sans-serif;margin:0}
.top{background:orange;padding:14px}
.search{padding:10px}
.search input{width:100%;padding:12px;border-radius:10px;background:#1e1e1e;color:white;border:1px solid #333}
.grid{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:10px}
.card b{font-size:11px}
.card button{background:gold;color:black;padding:6px;width:100%;border-radius:20px;margin-top:6px;font-weight:bold}
</style>
</head>
<body>
<div id="home">
<div class="top"><b>Uganda National Portal - 60 Schools</b><br><small>S2 Active - Loop trick</small></div>
<div class="search"><input id="s" oninput="filter()" placeholder="Search schools..."></div>
<div id="g" class="grid"></div>
</div>
<script>
let schools=[
"Uganda Martyrs Lubaga",
"St Jude Kakooge",
"Gayaza High",
"Kings Budo",
"St Marys Kitende",
"Makerere College",
"Kibuli SS",
"Mengo SS",
"Rubaga Girls",
"Trinity Nabbingo",
"Namagunga",
"Namilyango",
"Seeta High",
"St Lawrence",
"Vienna College",
"Kololo SS",
"Kitante Hill",
"Lubiri SS",
"Old Kampala SS",
"Kawempe Muslim"
];
let g=document.getElementById('g');
schools.forEach(s=>{
g.innerHTML+=`<div class="card"><b>${s}</b><br><button onclick="alert('School: ${s} - Admission: Try ST001')">View Portal</button></div>`;
});
function filter(){
let q=document.getElementById('s').value.toLowerCase();
document.querySelectorAll('.card').forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';
});
}
</script>
</body>
</html>
